version: "3.8"

services:
  # ── SYNAPSE AI Full-Stack Application (Backend + Static Frontend) ───────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapse_app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-synapse_user}:${POSTGRES_PASSWORD:-synapse_secure_pass}@db:5432/${POSTGRES_DB:-synapse_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-synapse_super_secure_jwt_secret_key_change_in_prod}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:5173,http://localhost:3000}
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-120}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - AUTO_MIGRATE=true
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - synapse_data:/app/data
      - chroma_data:/app/chroma_db
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - synapse_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── PostgreSQL Managed Relational Database ─────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: synapse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-synapse_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - synapse_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse_user} -d ${POSTGRES_DB:-synapse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: synapse_postgres_data
  synapse_data:
    name: synapse_app_data
  chroma_data:
    name: synapse_chroma_data

networks:
  synapse_net:
    name: synapse_internal_net
    driver: bridge
